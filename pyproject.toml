[project]
name = "ciumb-analitica"
version = "0.1.0"
description = "Área analítica del motor de informes del CIUMB (UMB): spec -> SQL -> cifras -> contrato -> validación -> exportación."
readme = "README.md"
authors = [{ name = "Daniel Barragán" }]
requires-python = ">=3.12,<3.13"
# Solo librerías de la Tabla 19 del diseño (costo cero, código abierto).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "weasyprint>=63",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
# Controlador de BD. El motor del CIUMB no está confirmado (ver docs/decisiones.md, D-02).
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",          # requerido por fastapi.testclient
    "ruff>=0.8",
    "pre-commit>=4.0",
    "faker>=30",            # solo para datos_sinteticos/
    "psycopg[binary]>=3.2", # BD de desarrollo en Docker
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciumb_analitica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs", "herramientas"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert en pruebas

[tool.ruff.lint.per-file-ignores]
"datos_sinteticos/*" = ["S311"]  # random no criptográfico es intencional (semilla fija)
